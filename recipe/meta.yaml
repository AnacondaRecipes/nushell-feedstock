{% set name = "nushell" %}
{% set version = "0.116.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 0cca0c5bc9d9eb608dee00c75b6b511917df6e66c784b034468bab2ff0fbb9b4

build:
  number: 0

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - clangdev  # [osx]
  host:
    - zlib {{ zlib }}
    - openssl {{ openssl }} # through the run_exports
    - libgit2 {{ libgit2 }} # [osx]
    - libiconv {{ libiconv }} # [osx]
    - libcurl {{ libcurl }} # [osx]

test:
  commands:
    - pip check
    - nu -c 'print ($env.NU_LIB_DIRS)'  # [unix]
    - nu -c "print ($env.NU_LIB_DIRS)"  # [win]
    - nu --version
    - nu --help
    - mkdir -p $CONDA_PREFIX/share/nushell/lib  # [unix]
    - echo "export def hi [] { \"foo\" }" > $CONDA_PREFIX/share/nushell/lib/foo.nu  # [unix]
    - mkdir %CONDA_PREFIX%\share\nushell\lib  # [win]
    - echo export def hi [] { "foo" }> %CONDA_PREFIX%\share\nushell\lib\foo.nu  # [win]
    - nu -c "use foo.nu hi; hi"
  requires:
    - pip

about:
  home: https://www.nushell.sh
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: A new type of shell
  description: A new type of shell
  dev_url: https://github.com/nushell/nushell
  doc_url: https://github.com/nushell/nushell

extra:
  recipe-maintainers:
    - thebigdalt
    - pavelzw
